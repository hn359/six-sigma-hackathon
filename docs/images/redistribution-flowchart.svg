<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1960" viewBox="0 0 1400 1960" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#46525e"/></marker></defs><rect width="1400" height="1960" fill="#ffffff"/><text x="40" y="52" font-size="30" font-weight="800" fill="#13212c">How the van decides: redistribution logic</text><text x="40" y="84" font-size="16" fill="#566573">Bikeshare Dispatch (Battery Ninjas) · every number comes from app/qc.py · spec limits are 20% and 80% of each station's docks</text><path d="M560.0,174.0 L560.0,214.0" fill="none" stroke="#46525e" stroke-width="2.2" marker-end="url(#a)"/><path d="M560.0,290.0 L560.0,330.0" fill="none" stroke="#46525e" stroke-width="2.2" marker-end="url(#a)"/><path d="M560.0,406.0 L560.0,445.0" fill="none" stroke="#46525e" stroke-width="2.2" marker-end="url(#a)"/><path d="M810.0,550.0 L910.0,550.0" fill="none" stroke="#46525e" stroke-width="2.2" marker-end="url(#a)"/><path d="M560.0,655.0 L560.0,690.0" fill="none" stroke="#46525e" stroke-width="2.2" marker-end="url(#a)"/><path d="M1110.0,465.0 L1110.0,406.0" fill="none" stroke="#46525e" stroke-width="2.2" marker-end="url(#a)"/><path d="M1110.0,635.0 L1110.0,728.0 L840.0,728.0" fill="none" stroke="#46525e" stroke-width="2.2" marker-end="url(#a)"/><path d="M560.0,766.0 L560.0,806.0" fill="none" stroke="#46525e" stroke-width="2.2" marker-end="url(#a)"/><path d="M560.0,902.0 L560.0,955.0" fill="none" stroke="#46525e" stroke-width="2.2" marker-end="url(#a)"/><path d="M795.0,1030.0 L940.0,1030.0" fill="none" stroke="#46525e" stroke-width="2.2" marker-end="url(#a)"/><path d="M560.0,1105.0 L560.0,1150.0" fill="none" stroke="#46525e" stroke-width="2.2" marker-end="url(#a)"/><path d="M560.0,1226.0 L560.0,1255.0" fill="none" stroke="#46525e" stroke-width="2.2" marker-end="url(#a)"/><path d="M350.0,1320.0 L280.0,1320.0 L280.0,1420.0" fill="none" stroke="#46525e" stroke-width="2.2" marker-end="url(#a)"/><path d="M770.0,1320.0 L960.0,1320.0 L960.0,1420.0" fill="none" stroke="#46525e" stroke-width="2.2" marker-end="url(#a)"/><path d="M280.0,1520.0 L280.0,1550.0 L500.0,1550.0 L500.0,1580.0" fill="none" stroke="#46525e" stroke-width="2.2" marker-end="url(#a)"/><path d="M960.0,1520.0 L960.0,1550.0 L620.0,1550.0 L620.0,1580.0" fill="none" stroke="#46525e" stroke-width="2.2" marker-end="url(#a)"/><path d="M560.0,1656.0 L560.0,1696.0" fill="none" stroke="#46525e" stroke-width="2.2" marker-end="url(#a)"/><path d="M560.0,1760.0 L560.0,1800.0" fill="none" stroke="#46525e" stroke-width="2.2" marker-end="url(#a)"/><path d="M280.0,1832.0 L34.0,1832.0 L34.0,142.0 L280.0,142.0" fill="none" stroke="#46525e" stroke-width="2.2" marker-end="url(#a)"/><path d="M1260.0,368.0 L1385.0,368.0" fill="none" stroke="#46525e" stroke-width="2.2"/><path d="M1280.0,1030.0 L1385.0,1030.0 L1385.0,142.0 L840.0,142.0" fill="none" stroke="#46525e" stroke-width="2.2" marker-end="url(#a)"/><rect x="280.0" y="110" width="560" height="64" rx="32" fill="#13212c" stroke="#13212c" stroke-width="2"/><text x="560.0" y="137.0" text-anchor="middle" font-size="16" font-weight="500" fill="#ffffff">A new reading arrives (every 15 min)</text><text x="560.0" y="158.2" text-anchor="middle" font-size="16" font-weight="500" fill="#ffffff">for every station</text><rect x="280.0" y="214" width="560" height="76" rx="10" fill="#e8f1f8" stroke="#2f6fa3" stroke-width="2"/><text x="560.0" y="247.0" text-anchor="middle" font-size="16" font-weight="500" fill="#13212c">Rider net flow   f = bikes now − bikes before − van move before</text><text x="560.0" y="268.2" text-anchor="middle" font-size="16" font-weight="500" fill="#13212c">(the van&#x27;s own moves are taken out)</text><rect x="280.0" y="330" width="560" height="76" rx="10" fill="#e8f1f8" stroke="#2f6fa3" stroke-width="2"/><text x="560.0" y="363.0" text-anchor="middle" font-size="16" font-weight="500" fill="#13212c">Chart point   x = f − usual flow for this time slot (μ)</text><text x="560.0" y="384.2" text-anchor="middle" font-size="16" font-weight="500" fill="#13212c">μ is learned from week 1 (no van)</text><path d="M560,445.0 L810.0,550 L560,655.0 L310.0,550 Z" fill="#fff4dc" stroke="#c98a00" stroke-width="2"/><text x="560" y="517.9" text-anchor="middle" font-size="15" font-weight="700" fill="#13212c">Does a Western Electric rule fire?</text><text x="560" y="536.4" text-anchor="middle" font-size="14" font-weight="500" fill="#13212c">R1: 1 point beyond 3σ</text><text x="560" y="554.9" text-anchor="middle" font-size="14" font-weight="500" fill="#13212c">R2: 2 of the last 3 beyond 2σ</text><text x="560" y="573.4" text-anchor="middle" font-size="14" font-weight="500" fill="#13212c">R3: 4 of the last 5 beyond 1σ</text><text x="560" y="591.9" text-anchor="middle" font-size="14" font-weight="500" fill="#13212c">R4: 8 in a row on one side</text><path d="M1110,465.0 L1310.0,550 L1110,635.0 L910.0,550 Z" fill="#fff4dc" stroke="#c98a00" stroke-width="2"/><text x="1110" y="536.4" text-anchor="middle" font-size="15" font-weight="700" fill="#13212c">Is the station out of spec?</text><text x="1110" y="554.9" text-anchor="middle" font-size="14" font-weight="500" fill="#13212c">bikes &lt; 20% of docks  or</text><text x="1110" y="573.4" text-anchor="middle" font-size="14" font-weight="500" fill="#13212c">bikes &gt; 80% of docks  (4 / 16 of 20)</text><rect x="960" y="330" width="300" height="76" rx="10" fill="#f0f1f3" stroke="#8a93a0" stroke-width="2"/><text x="1110.0" y="363.0" text-anchor="middle" font-size="16" font-weight="500" fill="#3b4450">In control:</text><text x="1110.0" y="384.2" text-anchor="middle" font-size="16" font-weight="500" fill="#3b4450">no van needed</text><rect x="280.0" y="690" width="560" height="76" rx="10" fill="#e8f1f8" stroke="#2f6fa3" stroke-width="2"/><text x="560.0" y="723.0" text-anchor="middle" font-size="16" font-weight="500" fill="#13212c">Trigger = rule n  (or &#x27;out of spec&#x27; = safety net)</text><text x="560.0" y="744.2" text-anchor="middle" font-size="16" font-weight="500" fill="#13212c">Direction: draining (needs bikes) / filling (too many)</text><rect x="280.0" y="806" width="560" height="96" rx="10" fill="#e8f1f8" stroke="#2f6fa3" stroke-width="2"/><text x="560.0" y="838.5" text-anchor="middle" font-size="16" font-weight="500" fill="#13212c">Move = expected path E(k) − bikes now</text><text x="560.0" y="859.6" text-anchor="middle" font-size="16" font-weight="500" fill="#13212c">rounded · at most ±10 bikes · stays within 0 … docks</text><text x="560.0" y="880.7" text-anchor="middle" font-size="16" font-weight="500" fill="#13212c">E(k) = tonight&#x27;s start plan + usual flow so far</text><path d="M560,955.0 L795.0,1030 L560,1105.0 L325.0,1030 Z" fill="#fff4dc" stroke="#c98a00" stroke-width="2"/><text x="560" y="1025.7" text-anchor="middle" font-size="15" font-weight="700" fill="#13212c">Is the move 0, or does it point</text><text x="560" y="1044.1" text-anchor="middle" font-size="14" font-weight="500" fill="#13212c">against the drift?</text><rect x="940" y="992" width="340" height="76" rx="10" fill="#f0f1f3" stroke="#8a93a0" stroke-width="2"/><text x="1110.0" y="1025.0" text-anchor="middle" font-size="16" font-weight="500" fill="#3b4450">No move: the station is already</text><text x="1110.0" y="1046.2" text-anchor="middle" font-size="16" font-weight="500" fill="#3b4450">past its path, heading back</text><rect x="280.0" y="1150" width="560" height="76" rx="10" fill="#e5f5ea" stroke="#2b7a3d" stroke-width="2"/><text x="560.0" y="1183.0" text-anchor="middle" font-size="16" font-weight="500" fill="#13212c">ONE van, ONE stop per reading: pick the station</text><text x="560.0" y="1204.2" text-anchor="middle" font-size="16" font-weight="500" fill="#13212c">furthest from its expected path (tie → lower ID)</text><path d="M560,1255.0 L770.0,1320 L560,1385.0 L350.0,1320 Z" fill="#fff4dc" stroke="#c98a00" stroke-width="2"/><text x="560" y="1315.7" text-anchor="middle" font-size="15" font-weight="700" fill="#13212c">Bring bikes (+)</text><text x="560" y="1334.1" text-anchor="middle" font-size="14" font-weight="500" fill="#13212c">or take bikes (−)?</text><rect x="70" y="1420" width="420" height="100" rx="10" fill="#e5f5ea" stroke="#2b7a3d" stroke-width="2"/><text x="280.0" y="1454.5" text-anchor="middle" font-size="16" font-weight="500" fill="#13212c">BRING: collect from the station with the most</text><text x="280.0" y="1475.6" text-anchor="middle" font-size="16" font-weight="500" fill="#13212c">spare bikes above its own path,</text><text x="280.0" y="1496.7" text-anchor="middle" font-size="16" font-weight="500" fill="#13212c">the rest from the reserve depot</text><rect x="630" y="1420" width="420" height="100" rx="10" fill="#e5f5ea" stroke="#2b7a3d" stroke-width="2"/><text x="840.0" y="1454.5" text-anchor="middle" font-size="16" font-weight="500" fill="#13212c">TAKE: drop at the station most below</text><text x="840.0" y="1475.6" text-anchor="middle" font-size="16" font-weight="500" fill="#13212c">its own path,</text><text x="840.0" y="1496.7" text-anchor="middle" font-size="16" font-weight="500" fill="#13212c">the rest at the reserve depot</text><rect x="280.0" y="1580" width="560" height="76" rx="10" fill="#e8f1f8" stroke="#2f6fa3" stroke-width="2"/><text x="560.0" y="1613.0" text-anchor="middle" font-size="16" font-weight="500" fill="#13212c">Apply: update both stations&#x27; bikes,</text><text x="560.0" y="1634.2" text-anchor="middle" font-size="16" font-weight="500" fill="#13212c">record van_moved and a line in van_log.csv</text><rect x="280.0" y="1696" width="560" height="64" rx="10" fill="#e8f1f8" stroke="#2f6fa3" stroke-width="2"/><text x="560.0" y="1733.6" text-anchor="middle" font-size="16" font-weight="500" fill="#13212c">Restart the run-rule history of the stations the van touched</text><rect x="280.0" y="1800" width="560" height="64" rx="32" fill="#13212c" stroke="#13212c" stroke-width="2"/><text x="560.0" y="1837.6" text-anchor="middle" font-size="16" font-weight="500" fill="#ffffff">The next reading starts from the bikes AFTER the van</text><rect x="1080" y="1150" width="290" height="210" rx="10" fill="#ffffff" stroke="#9aa6b2" stroke-width="2" stroke-dasharray="6 5"/><text x="1225.0" y="1210.8" text-anchor="middle" font-size="16" font-weight="700" fill="#13212c">Every night (start plan)</text><text x="1225.0" y="1230.5" text-anchor="middle" font-size="15" font-weight="500" fill="#13212c">C(k) = usual flow added up</text><text x="1225.0" y="1250.3" text-anchor="middle" font-size="15" font-weight="500" fill="#13212c">allowed start s:</text><text x="1225.0" y="1270.2" text-anchor="middle" font-size="15" font-weight="500" fill="#13212c">LSL − min C ≤ s ≤ USL − max C</text><text x="1225.0" y="1290.0" text-anchor="middle" font-size="15" font-weight="500" fill="#13212c">→ use the middle</text><text x="1225.0" y="1309.8" text-anchor="middle" font-size="15" font-weight="500" fill="#13212c">Expected path E(k) = s + C(k)</text><rect x="1080" y="1400" width="290" height="210" rx="10" fill="#ffffff" stroke="#9aa6b2" stroke-width="2" stroke-dasharray="6 5"/><text x="1225.0" y="1460.8" text-anchor="middle" font-size="16" font-weight="700" fill="#13212c">Every week (did it work?)</text><text x="1225.0" y="1480.5" text-anchor="middle" font-size="15" font-weight="500" fill="#13212c">p-chart per station:</text><text x="1225.0" y="1500.3" text-anchor="middle" font-size="15" font-weight="500" fill="#13212c">p = share of readings out of</text><text x="1225.0" y="1520.2" text-anchor="middle" font-size="15" font-weight="500" fill="#13212c">spec that day; week 1 sets</text><text x="1225.0" y="1540.0" text-anchor="middle" font-size="15" font-weight="500" fill="#13212c">p̄ ± 3σ limits; week 2 below</text><text x="1225.0" y="1559.8" text-anchor="middle" font-size="15" font-weight="500" fill="#13212c">LCL = policy really helped</text><text x="824.0" y="540" font-size="15" font-weight="800" fill="#2f6fa3">No</text><text x="570" y="673.0" font-size="15" font-weight="800" fill="#2f6fa3">Yes</text><text x="1120" y="453.0" font-size="15" font-weight="800" fill="#2f6fa3">No</text><text x="1120" y="653.0" font-size="15" font-weight="800" fill="#2f6fa3">Yes</text><text x="809.0" y="1020" font-size="15" font-weight="800" fill="#2f6fa3">Yes</text><text x="570" y="1123.0" font-size="15" font-weight="800" fill="#2f6fa3">No</text><text x="270.0" y="1310" font-size="15" font-weight="800" fill="#2f6fa3">+ bring</text><text x="784.0" y="1310" font-size="15" font-weight="800" fill="#2f6fa3">− take</text><text x="42" y="900" font-size="15" font-weight="800" fill="#2f6fa3">next reading</text><text x="1130" y="132.0" font-size="15" font-weight="800" fill="#2f6fa3">wait for the next reading</text><rect x="40" y="1910" width="26" height="18" rx="4" fill="#13212c" stroke="#13212c" stroke-width="2"/><text x="74" y="1924" font-size="15" fill="#3b4450">start / loop</text><rect x="255" y="1910" width="26" height="18" rx="4" fill="#e8f1f8" stroke="#2f6fa3" stroke-width="2"/><text x="289" y="1924" font-size="15" fill="#3b4450">calculation</text><rect x="470" y="1910" width="26" height="18" rx="4" fill="#fff4dc" stroke="#c98a00" stroke-width="2"/><text x="504" y="1924" font-size="15" fill="#3b4450">decision</text><rect x="685" y="1910" width="26" height="18" rx="4" fill="#e5f5ea" stroke="#2b7a3d" stroke-width="2"/><text x="719" y="1924" font-size="15" fill="#3b4450">van action</text><rect x="900" y="1910" width="26" height="18" rx="4" fill="#f0f1f3" stroke="#8a93a0" stroke-width="2"/><text x="934" y="1924" font-size="15" fill="#3b4450">no action</text><rect x="1115" y="1910" width="26" height="18" rx="4" fill="#ffffff" stroke="#9aa6b2" stroke-width="2"/><text x="1149" y="1924" font-size="15" fill="#3b4450">nightly / weekly</text></svg>